<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>OpenSelf context receipt</title>
        {{STYLE}}
    </head>
    <body>
        <main aria-label="OpenSelf context receipt">
            <header>
                <span class="eyebrow">OPENSELF · READ-ONLY</span>
                <h1>Context receipt</h1>
            </header>
            <p id="status" role="status" aria-live="polite">Connecting to the MCP host…</p>
            <section id="receipt" aria-label="Context package"></section>
            <footer>
                Only the context package supplied by the host is shown. This card does not read or
                change your vault.
            </footer>
        </main>
        {{SCRIPT}}
    </body>
</html>
