name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }} · node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['22.13.0', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Prepare isolated macOS keychain
        if: matrix.os == 'macos-latest'
        run: |
          security create-keychain -p openself-ci-test-only "$RUNNER_TEMP/openself-test.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/openself-test.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/openself-test.keychain-db"
          security unlock-keychain -p openself-ci-test-only "$RUNNER_TEMP/openself-test.keychain-db"

      - name: Install Linux native key provider
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11

      - name: Native OS key integration (Windows and macOS)
        if: matrix.os != 'ubuntu-latest'
        timeout-minutes: 5
        run: npm run test:native-key

      - name: Native OS key integration (isolated Linux session)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/openself-keyring"
          mkdir -p "$XDG_DATA_HOME"
          chmod 700 "$XDG_DATA_HOME"
          dbus-run-session -- bash -e -c 'printf %s openself-ci-test-only | gnome-keyring-daemon --unlock --daemonize --components=secrets >/dev/null; npm run test:native-key'

      - name: Remove isolated macOS keychain
        if: always() && matrix.os == 'macos-latest'
        run: security delete-keychain "$RUNNER_TEMP/openself-test.keychain-db"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Public TypeScript contract
        run: npm run test:types

      - name: Installed package compatibility
        run: npm run test:package

      - name: Unit tests
        run: npm test

      - name: Coverage (Linux + Node 22.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.13.0'
        run: npm run test:coverage

      - name: Context retrieval and privacy evaluations
        run: npm run eval:context

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.13.0'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: CLI smoke — feed + help
        shell: bash
        run: |
          node src/cli/index.js --help
          node src/cli/index.js feed --whatsapp ./test-data/sample-whatsapp.txt --name "Harvey"
          test -f data/SOUL.md
          test -f data/personality.json

      - name: Publint (Linux + Node 22.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.13.0'
        run: npx --yes publint --strict

      - name: NPM pack dry-run (Linux + Node 22.13 only)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.13.0'
        run: npm pack --dry-run
